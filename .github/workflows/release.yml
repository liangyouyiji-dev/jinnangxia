name: Sign and verify binary distribution
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft release ID
        type: string
        required: true
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  distribute:
    if: github.repository == 'liangyouyiji-dev/jnbox' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - name: Checkout distribution tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate candidate against reviewed manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > draft.json
          jq -e --arg tag "$TAG" '.draft and (.prerelease | not) and .tag_name == $tag' draft.json
          mkdir candidate
          cp "jnbox_${TAG#v}_checksums.txt" expected-checksums.txt
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          version = os.environ['TAG'][1:]
          expected = {f'jnbox_{version}_{p}.{ext}' for p, ext in [
              ('darwin_amd64','tar.gz'), ('darwin_arm64','tar.gz'),
              ('linux_amd64','tar.gz'), ('linux_arm64','tar.gz'),
              ('linux_386','tar.gz'), ('linux_riscv64','tar.gz'),
              ('windows_amd64','zip'), ('windows_arm64','zip')]}
          expected.add(f'jnbox_{version}_sbom.json')
          lines = Path('expected-checksums.txt').read_text().splitlines()
          assert len(lines) == len(expected)
          found = set()
          for line in lines:
              digest, name = line.split('  ')
              assert re.fullmatch('[0-9a-f]{64}', digest)
              assert name in expected and name not in found
              found.add(name)
          assert found == expected
          manifest = f'jnbox_{version}_checksums.txt'
          files = expected | {manifest}
          assets = json.loads(Path('draft.json').read_text())['assets']
          assert len({a['name'] for a in assets}) == len(assets)
          assert files <= {a['name'] for a in assets} <= files | {manifest + '.sig', manifest + '.pem'}
          for asset in assets:
              if asset['name'] in files:
                  assert asset['state'] == 'uploaded'
                  with (Path('candidate') / asset['name']).open('wb') as out:
                      subprocess.run(['gh', 'api', '-H', 'Accept: application/octet-stream',
                                      f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{int(asset['id'])}"],
                                     stdout=out, check=True)
          PY
          cmp expected-checksums.txt "candidate/jnbox_${TAG#v}_checksums.txt"
          (cd candidate && sha256sum --check "jnbox_${TAG#v}_checksums.txt")
      - name: Install pinned Cosign
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/sigstore/cosign/releases/download/v2.6.0/cosign-linux-amd64 -o cosign
          echo "ea5c65f99425d6cfbb5c4b5de5dac035f14d09131c1a0ea7c7fc32eab39364f9  cosign" | sha256sum --check
          chmod +x cosign
      - name: Smoke test Linux binary and contract identity
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf "candidate/jnbox_${TAG#v}_linux_amd64.tar.gz" -C smoke jnbox
          HOME="$RUNNER_TEMP/jnbox-check" JNBOX_DISABLE_ERROR_REPORT=1 ./smoke/jnbox version --verify-artifact --expected-version "${TAG#v}" --require-contract schema/v1 --require-clean --format json
      - name: Sign distribution checksums with GitHub identity
        run: |
          set -euo pipefail
          manifest="candidate/jnbox_${TAG#v}_checksums.txt"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" +            --jq '.draft and (.prerelease | not)' | grep -qx true
          ./cosign sign-blob --yes --output-signature "$manifest.sig" --output-certificate "$manifest.pem" "$manifest"
          ./cosign verify-blob --certificate "$manifest.pem" --signature "$manifest.sig" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" "$manifest"
          gh release upload "$TAG" "$manifest.sig" "$manifest.pem" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Keep candidate pending installation and upgrade verification
        run: echo "Draft $TAG is signed and ready for acceptance."
